# SPDX-License-Identifier: MIT
#
# Deploy the website and the static demo that website.yml builds and checks, from main and on a daily
# refresh; a pull request runs CI's `website` job instead (pr.yml). Setup, DNS, demo and media
# operations: docs/website.md. Rules: AGENTS.md, "Modes and hosting", and .github/AGENTS.md, Releases.
name: Website

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *' # daily, for the repository widget; a no-op until the deploy is switched on (the build job's `if`)

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: website-build
    # A scheduled run only refreshes what is deployed, so it is skipped while the deploy is switched off.
    if: github.event_name != 'schedule' || vars.PAGES_DEPLOY == 'true'
    uses: ./.github/workflows/website.yml
    with:
      # A push to main deploys while the deploy is switched on; a run by hand on another branch only builds.
      deploy: ${{ vars.PAGES_DEPLOY == 'true' && github.ref == 'refs/heads/main' }}

  deploy:
    name: website-deploy
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # deploy to GitHub Pages
      id-token: write # prove the deployment's origin to Pages
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
