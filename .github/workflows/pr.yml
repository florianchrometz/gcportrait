# SPDX-License-Identifier: MIT
#
# Pull-request and main-branch checks (docs/contributing.md §4, "Continuous integration"). The jobs run side by side,
# those a change of only docs and media skips after a first small job, `changes`, has sorted the changed files
# (below), so the run takes as long as its slowest job, not the sum of its jobs. Each job that needs the dependencies
# installs them itself from the pnpm store cache (.github/actions/setup), which pnpm-lock.yaml keys: a lockfile that
# is out of date fails every such job at its install step, with pnpm's ERR_PNPM_OUTDATED_LOCKFILE. The install's
# `prepare` script compiles the asset catalog (packages/catalog/src/generated/, a git-ignored build artefact);
# `catalog-check` compiles it once more as a step of its own, so a catalog that cannot be compiled at all shows up
# there by name.
#
# The jobs and what they run (the same commands as locally; docs/contributing.md has the table of the jobs):
#
#   changes         which kinds of files the change touches: docs, media or anything else (below); no install
#   lint            pnpm format:check, pnpm lint
#   typecheck       pnpm typecheck (tsc -b, then astro check over the website's .astro files)
#   unit            pnpm test in three legs: layout and frontend (the `unit` matrix), every other Vitest project
#                   (`unit-other`, below)
#   layout-budget   the layout's strict budgets and bench table, and its properties explored; non-blocking (below)
#   catalog-check   pnpm catalog:build, pnpm catalog:check
#   build           the app's workspaces (pnpm build:app), then the SPA size budgets (pnpm size)
#   e2e             Playwright on Chromium in five legs, each a round-robin share of its projects' tests: the desktop
#                   specs in three, the phone and tablet ones in two
#   website         the website built and checked (pnpm website:build, website:check), then its phone-width check
#   provenance      pnpm provenance, then a self-test that the guard still rejects a planted banned file
#   licenses        pnpm run licenses
#   audit           node scripts/check-audit.mjs (needs the npm registry)
#   workflows-and-shell   actionlint over the workflows, shellcheck over every shell script
#   required        the one check branch protection targets: green only when every job above but layout-budget
#                   succeeded, or was skipped for a change of only docs and media (below)
#
# A change of only docs and media runs only the jobs that read such files (AGENTS.md, Quality gates, testing and
# CI). `changes` sorts every changed file into one of three kinds:
#
#   docs    Markdown that people read and, of the jobs, only unit (all other projects), website, provenance and
#           licenses: docs/**/*.md, .changeset/*.md, the root's *.md files, each top-level folder's and each
#           package's README.md and CHANGELOG.md, and each top-level folder's AGENTS.md (a rules file, whose
#           citations the tooling tests in unit (all other projects) check). Not the skills' files
#           (.agents/skills/: the frontend's theme test reads the style skill's palette) and no other Markdown
#           (catalog-check, for one, refuses a file in the catalog's data folders that is not YAML or JSON).
#   media   docs/media/**, what `pnpm media` and `node scripts/exports.mjs` write.
#   code    every other file.
#
# With no code among the changed files, the run keeps unit (all other projects) (the user guides' check, the
# README's and the media's tests, the backend's and the website's tests read these files), website, provenance
# and required, with docs licenses too (THIRD_PARTY.md) and with media lint's Prettier step (the media's two
# manifests are JSON). It skips typecheck, unit (layout), unit (frontend), layout-budget, catalog-check, build,
# e2e, audit, workflows-and-shell and lint's ESLint step: none of them reads a changed file, so each would give
# the result it gave the tree before the change, which that commit's own run reports. Every job runs when the
# comparison cannot be made (a new branch, a push whose commit before is not in the history) or finds no file.
#
# Pinning: every action is pinned to a commit, with its release as a comment, and the two linters downloaded here
# are pinned by version and SHA-256. Dependabot (github-actions) proposes new releases of the actions; the linters
# are bumped by hand.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One group per pull request, and one per commit on main: a newer push to a pull request cancels the run it
  # supersedes, while every commit on main keeps a complete CI result of its own.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The kinds of files the change touches (the header): `code`, `docs` and `media`, each `true` or `false`. A push
  # is compared with the commit before it (github.event.before), a pull request's merge commit with its first
  # parent, the tip of the branch it merges into, so either way the files are those the change brings to the tree
  # it starts from. The checkout fetches every commit and tree but file contents only for the checked-out tree (a
  # blobless partial clone): `git diff --name-only --no-renames` compares trees only, and without rename detection
  # it never asks for a file's contents; GIT_NO_LAZY_FETCH keeps git from fetching an object that is missing (the
  # checkout keeps no credentials), so a missing commit ends the comparison instead. Every doubt in the step ends
  # in `code=true`, and the jobs skip only on `code == 'false'`, so a doubt runs them all; should this job fail,
  # the jobs that need it are skipped and `required` fails.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
      docs: ${{ steps.classify.outputs.docs }}
      media: ${{ steps.classify.outputs.media }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: Sort the changed files into docs, media and code
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          GIT_NO_LAZY_FETCH: '1'
          GIT_TERMINAL_PROMPT: '0'
          MEDIA: '^docs/media/'
          DOCS: '^(docs/.+|\.changeset/[^/]+|[^/]+|([^/]+|packages/[^/]+)/(README|CHANGELOG|AGENTS))\.md$'
        run: |
          base=''
          if [ "$EVENT" = pull_request ]; then
            # GitHub's merge commit of the pull request has two parents, the branch it merges into first.
            if [ "$(git rev-list --no-walk --parents HEAD | wc -w)" -eq 3 ]; then
              base=$(git rev-parse 'HEAD^1')
            fi
          elif [ "$EVENT" = push ] && [[ "$BEFORE" =~ ^[0-9a-f]+$ ]] && [[ ! "$BEFORE" =~ ^0+$ ]]; then
            base=$BEFORE
          fi
          reason=''
          files=''
          if [ -z "$base" ]; then
            reason='no commit to compare with'
          elif ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            reason="the commit before, ${base}, is not in the history"
          elif ! files=$(git diff --name-only --no-renames "$base" HEAD); then
            reason='git diff failed'
          elif [ -z "$files" ]; then
            reason='no file changed'
          fi
          code=true
          docs=false
          media=false
          if [ -z "$reason" ]; then
            code=false
            while IFS= read -r file; do
              if [[ $file =~ $MEDIA ]]; then
                media=true
              elif [[ $file =~ $DOCS ]]; then
                docs=true
              else
                code=true
              fi
            done <<< "$files"
          fi
          {
            echo "code=$code"
            echo "docs=$docs"
            echo "media=$media"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$reason" ]; then
            summary="Every job runs: ${reason}."
          else
            summary="Compared with ${base::12}, files changed: $(grep -c '' <<< "$files")"
            summary+="; code ${code}, docs ${docs}, media ${media}."
            if [ "$code" = false ]; then
              summary+=' Only docs and media changed: the jobs that read neither are skipped (the header).'
            fi
            head -n 100 <<< "$files"
          fi
          echo "$summary"
          printf '### Changes\n\n%s\n' "$summary" >> "$GITHUB_STEP_SUMMARY"

  # Prettier checks the media's two JSON manifests too; neither tool reads Markdown (.prettierignore,
  # eslint.config.js), and ESLint lints source files only.
  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.code != 'false' || needs.changes.outputs.media == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Formatting (Prettier)
        run: pnpm run format:check
      - name: ESLint (strict type-checked rules, import boundaries)
        if: needs.changes.outputs.code != 'false'
        # The type-checked rules hold every workspace's type information at once, more than Node's default
        # heap (about 2 GiB on the runner) holds.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm run lint

  typecheck:
    name: typecheck
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: TypeScript (tsc -b over every project, then astro check over the website's .astro files)
        run: pnpm run typecheck

  # `pnpm test` (every Vitest project of vitest.config.ts) in three legs. The layout runs alone because its
  # performance tests assert 2 x the budgets on CI (packages/layout/README.md, "Performance"), which other suites
  # on the same runner would eat into; the frontend is the largest project. These two are the `unit` matrix, which
  # a change of only docs and media skips; the third leg, `unit-other`, runs every project but those two, by
  # negation, on every change, so a new project is never left out, and a misspelt name in the first two legs fails
  # the leg ("No projects matched the filter") instead of skipping a project.
  unit:
    name: unit (${{ matrix.leg }})
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: layout
            projects: layout
          - leg: frontend
            projects: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Vitest (${{ matrix.projects }})
        env:
          PROJECTS: ${{ matrix.projects }}
        run: |
          args=()
          for project in $PROJECTS; do args+=(--project "$project"); done
          pnpm run test "${args[@]}"

  unit-other:
    name: unit (all other projects)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Vitest (!layout !frontend)
        run: pnpm run test --project '!layout' --project '!frontend'
      # The render golden's comparison (packages/render-cli/test/golden.test.ts, in this leg) leaves the image it
      # drew and a picture of the differences here when the bytes differ.
      - name: Upload the render golden's failure images
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-golden-failures
          path: out/render/golden-failures/
          if-no-files-found: ignore
          retention-days: 14

  # The layout's strict performance budgets (gcp-diagram-layout skill §7): S < 10 ms, M < 60 ms, L < 400 ms and XL
  # collapsed < 2 s through a worker, plus the memo, cancellation and memory checks, run alone
  # (`pnpm --filter @gcportrait/layout test:budget`), then the bench's table in the job summary.
  #
  # Non-blocking on purpose (continue-on-error, and `required` does not wait for it): the budgets are
  # wall-clock figures for a quiet M1-class machine (a laptop or desktop whose cores are as fast as an M1's, one
  # core per layout, no other load), and they do not scale with the machine that measures them. A shared
  # GitHub-hosted runner is slower single-threaded and varies from run to run, so its figures are expected
  # above the budgets by a margin, and a blocking strict job would fail for reasons outside the change and be
  # re-run until green. What blocks is the `unit (layout)` leg: the same measurements under `pnpm test` assert
  # 2 x the budgets, which catches real regressions on any runner. This job shows the runner's CPU and the
  # strict figures on every pull request, says which machine the budgets describe, and raises a warning when
  # one is missed; the strict run is part of the layout's local checks (packages/layout/README.md,
  # "Performance"). To make it blocking (e.g. on a larger or self-hosted runner, once its margin is known),
  # remove continue-on-error and add it to `required`.
  #
  # The job then explores the layout's properties over random Scenes, 1 000 runs each
  # (`pnpm --filter @gcportrait/layout explore`), under a seed taken from the run id: a re-run draws the same
  # inputs, a new push others. The blocking `unit (layout)` leg runs them under one fixed seed (CI_PROPERTY_SEED
  # of @gcportrait/model/testing), so a counterexample the change under test did not bring in is reported here,
  # with its seed and path, instead of failing an unrelated pull request.
  layout-budget:
    name: layout-budget
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Layout budgets, strict, for a quiet M1-class machine (S 10 ms, M 60 ms, L 400 ms, XL collapsed 2 s in a worker)
        id: budget
        run: pnpm --filter @gcportrait/layout test:budget
      # The summary names the runner's CPU: the figures are this runner's, not those of the machine the budgets
      # describe. lscpu names the CPU on every hosted runner (/proc/cpuinfo has no model name on Arm); newer
      # versions indent the line under its vendor.
      - name: Bench figures in the job summary
        id: bench
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status=0
          pnpm --silent --filter @gcportrait/layout bench > layout-bench.txt 2>&1 || status=$?
          cat layout-bench.txt
          cpu=$(LC_ALL=C lscpu | awk '/^[[:space:]]*Model name:/ && !found { sub(/^[^:]*:[[:space:]]*/, ""); print; found = 1 }')
          {
            echo '### Layout bench on a shared runner (the strict budgets describe a quiet M1-class machine)'
            echo
            echo "Runner: ${cpu:-unknown CPU}, $(nproc) cores, $(uname -sm)."
            echo
            echo '```text'
            cat layout-bench.txt
            echo '```'
            echo
            echo 'The strict budgets (gcp-diagram-layout skill §7) describe a quiet M1-class machine: one fast core per'
            echo "layout, no other load. The figures above are this shared runner's and are expected to exceed the"
            echo 'budgets by a margin, so this job only reports; the blocking unit (layout) leg asserts twice the budgets.'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Warn when a budget is missed
        if: failure() && (steps.budget.outcome == 'failure' || steps.bench.outcome == 'failure')
        run: echo "::warning title=Layout budget::A strict layout budget was missed on this shared runner. The budgets (gcp-diagram-layout skill §7) describe a quiet M1-class machine, so the runner's figures in the job summary are expected to exceed them by a margin; the blocking unit (layout) leg asserts twice the budgets."
      # fast-check prints a failing property's seed, path and shrunk counterexample; the summary keeps those
      # lines, and the full output is in the step's log.
      - name: Explore the layout's properties (1 000 runs each, a seed from the run id)
        id: explore
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          FC_SEED=$((RUN_ID % 2147483647))
          export FC_SEED
          status=0
          pnpm --silent --filter @gcportrait/layout explore > layout-explore.txt 2>&1 || status=$?
          cat layout-explore.txt
          {
            echo '### Layout properties explored: 1 000 runs each'
            echo
            echo "Seed ${FC_SEED}, from the run id. Replay: \`FC_SEED=${FC_SEED} pnpm --filter @gcportrait/layout explore\`."
            echo
            if [ "$status" -eq 0 ]; then
              echo 'Every property held.'
            else
              echo 'A property failed. fast-check names its seed, path and counterexample (the full output is in the log):'
              echo
              echo '```text'
              grep -E 'FAIL|Property failed|seed:|Counterexample|Tests ' layout-explore.txt | cut -c1-4000 | head -n 40 || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Warn when an explored property fails
        if: failure() && steps.explore.outcome == 'failure'
        run: echo "::warning title=Layout property::A layout property failed in the exploration (1 000 runs each, a seed from the run id). The job summary names the seed, the path and the counterexample; the blocking unit (layout) leg runs the properties under a fixed seed."

  catalog-check:
    name: catalog-check
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Already run by the install's `prepare` script; repeated here so a catalog that cannot be compiled is a
      # failed step of its own.
      - name: Compile the asset catalog (git-ignored build artefact)
        run: pnpm run catalog:build
      - name: Asset catalog validation and coverage
        run: pnpm run catalog:check

  # The app's workspaces (frontend, backend, catalog, icons; `pnpm build:app`, which leaves out the website that
  # the `website` job builds), then the SPA's size budgets on frontend/dist. Each e2e leg builds the SPA itself
  # (e2e/scripts/built-app.ts), so nothing waits for this build.
  build:
    name: build
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build the app's workspaces
        run: pnpm run build:app
      - name: SPA size budgets (gzipped; UI thread 350 kB, workers 400 kB; no zod on the UI thread)
        run: pnpm run size --summary "$GITHUB_STEP_SUMMARY"

  # Playwright on Chromium (e2e/playwright.config.ts): the functional flows in demo and normal mode, the export's
  # faithfulness checks, which compare the PNG Chromium draws with resvg's drawing of the same view on this runner,
  # axe in both themes, the app's phone and tablet check (the `mobile` project, e2e/tests/mobile.spec.ts and the
  # canvas's touch gestures in touch.spec.ts; alone: `pnpm --filter @gcportrait/frontend mobile`) and the flows by
  # finger on a phone and a tablet (the `chromium-phone` and `chromium-tablet` projects, e2e/tests/handheld.spec.ts).
  # Five legs, each with its own two servers: the app built in demo mode and in normal mode and served by `vite
  # preview` (with `CI` set, e2e/playwright.config.ts runs e2e/scripts/built-app.ts in place of the Vite dev
  # servers, so that every cold page load fetches the build's chunks, not every module, and the suite tests the
  # bundle that ships). The desktop window's projects (chromium-live and chromium) run in three legs, and every
  # other project (chromium-phone, chromium-tablet and mobile, named by negation so that a new project is never
  # left out) in two. Each leg runs a round-robin share of its projects' tests, every k-th of
  # their JSON listing, through `--test-list` (`pnpm --filter @gcportrait/e2e leg`, e2e/scripts/leg.ts), so that
  # the slow files spread over the legs; the script fails the leg when the run did not address every test of its
  # share, and writes the share's count and summed test time to the job summary. There are no screenshot
  # baselines: the committed visual baselines are SVG text (e2e/baselines/diagram/, compared by the frontend's unit
  # tests) and the render golden PNG (drawn by resvg's WebAssembly build, compared by the unit tests), so nothing
  # here depends on the operating system that wrote a baseline.
  e2e:
    name: e2e (${{ matrix.leg }})
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: desktop 1/3
            id: desktop-1
            projects: chromium-live chromium
            part: 1
            of: 3
          - leg: desktop 2/3
            id: desktop-2
            projects: chromium-live chromium
            part: 2
            of: 3
          - leg: desktop 3/3
            id: desktop-3
            projects: chromium-live chromium
            part: 3
            of: 3
          - leg: phones and tablets 1/2
            id: phones-and-tablets-1
            projects: '!chromium-live !chromium'
            part: 1
            of: 2
          - leg: phones and tablets 2/2
            id: phones-and-tablets-2
            projects: '!chromium-live !chromium'
            part: 2
            of: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/playwright
        with:
          browsers: chromium
      # The script resolves the negated projects against e2e/playwright.config.ts and fails on a name the config
      # does not have.
      - name: Playwright, ${{ matrix.leg }}
        env:
          PROJECTS: ${{ matrix.projects }}
          PART: ${{ matrix.part }}
          OF: ${{ matrix.of }}
        run: pnpm --filter @gcportrait/e2e run leg --projects "$PROJECTS" --leg "$PART" --of "$OF"
      - name: Upload the Playwright report, traces and export comparisons
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.id }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
            out/export/e2e/
          if-no-files-found: ignore
          retention-days: 14

  # The website (docs/website.md): built with its static demo at /demo/ and checked (`website:check`:
  # metadata, links, sitemap, self-hosted resources, the footer's non-affiliation notice, the demo's pages and
  # policy, every demo link opening a new tab), then at phone widths in Chromium (`mobile --only layout`: 320 to
  # 430 CSS pixels in both themes, sideways overflow, the sticky header, 44 px touch targets, axe). The phone
  # check's other half, playback of the landing page's animated demos on an iPhone in WebKit, stays a local check:
  # Playwright's WebKit on Linux is not Safari (its media stack is GStreamer, not the iPhone's), so its result would
  # not say what the check is for. pages.yml builds and deploys the site; this job is the pull request's gate.
  website:
    name: website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build the site
        run: pnpm run website:build
      - name: Check the site
        run: pnpm run website:check
      - uses: ./.github/actions/playwright
        with:
          browsers: chromium
          working-directory: website
      - name: The site at phone widths (layout and axe, Chromium)
        run: pnpm --filter @gcportrait/website run mobile --only layout

  provenance:
    name: provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The guard is a Node script without dependencies; it walks the checkout, which has no node_modules here.
      - uses: ./.github/actions/setup
        with:
          install: 'false'
      - name: Provenance guard (forbidden names, banned terms and files, SPDX headers)
        run: pnpm run provenance
      # Proves on every run that the guard still bites: a planted Go file must fail the check, and fail it for
      # that reason. The planted file exists only in this job's checkout.
      - name: 'Self-test: the guard rejects a planted banned file'
        run: |
          mkdir provenance-canary
          printf '%s\n' 'package main' > provenance-canary/planted.go
          if output=$(node scripts/check-provenance.mjs 2>&1); then
            echo "$output"
            echo "::error::The provenance guard accepted a planted banned file."
            exit 1
          fi
          echo "$output"
          if ! grep -qF 'provenance-canary/planted.go  [banned-file]' <<< "$output"; then
            echo "::error::The provenance guard failed, but not on the planted banned file."
            exit 1
          fi
          rm -r provenance-canary
          echo "Self-test passed: the planted banned file was rejected."

  # THIRD_PARTY.md, which the check compares with what it would write, is one of the docs.
  licenses:
    name: licenses
    needs: changes
    if: needs.changes.outputs.code != 'false' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Dependency licence allow-list and THIRD_PARTY.md staleness
        run: pnpm run licenses

  # The dependency audit (AGENTS.md, Security and privacy, principle 7; docs/security.md, "Dependency audit"):
  # `pnpm audit` over the production dependencies and over the whole tree, read from the lockfile (no
  # install). A high or critical advisory fails the job unless scripts/audit-allowlist.json accepts it, with a
  # reason and an expiry date at most 90 days out; moderate and low ones are listed. It asks the npm
  # registry's advisory service, so it can fail for a registry outage too (exit code 2, "could not run");
  # re-run it then. Between pull requests, GitHub's Dependabot alerts report new advisories (a repository
  # setting, docs/security.md).
  audit:
    name: audit
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: 'false'
      - name: Dependency audit (production and development; high and critical fail unless accepted)
        run: node scripts/check-audit.mjs

  # The workflows and the shell scripts, with two linters pinned by version and SHA-256 (actionlint's from its
  # release's checksums file, shellcheck's taken from its release archive when pinned). actionlint
  # (rhysd/actionlint) checks every workflow: syntax, expressions, job dependencies, the inputs of local
  # actions and, through the pinned shellcheck, the shell of every `run:` step in the workflow files (not
  # those of the composite actions, which only install). shellcheck then checks every shell script: the
  # deployment scripts at its default severity (as `shellcheck -x infra/*.sh` locally, infra/AGENTS.md, Commands),
  # the others for warnings and errors. infra/'s offline harness (`pnpm test:infra`) runs in `unit (all other
  # projects)`. Locally: `actionlint` and the two shellcheck commands below (docs/contributing.md).
  workflows-and-shell:
    name: workflows-and-shell
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      SHELLCHECK_VERSION: 0.11.0
      SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download actionlint and shellcheck
        run: |
          fetch() {
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/$2" "$1/$2"
            echo "$3  $RUNNER_TEMP/$2" | sha256sum --check --strict
            tar -xzf "$RUNNER_TEMP/$2" -C "$RUNNER_TEMP"
          }
          fetch "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}" \
            "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" "$ACTIONLINT_SHA256"
          fetch "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}" \
            "shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.gz" "$SHELLCHECK_SHA256"
          mkdir -p "$RUNNER_TEMP/bin"
          mv "$RUNNER_TEMP/actionlint" "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "$RUNNER_TEMP/bin/"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: actionlint (the workflows, their run scripts through shellcheck)
        run: actionlint -version && actionlint -color -shellcheck="$RUNNER_TEMP/bin/shellcheck"
      - name: shellcheck (the deployment scripts, default severity)
        run: shellcheck --version && shellcheck -x infra/*.sh
      - name: shellcheck (every other shell script, warnings and errors)
        run: |
          git ls-files -z -- '*.sh' ':!:infra/' \
            | xargs -0 --no-run-if-empty shellcheck -x --severity=warning

  # The one check to require in the branch protection or ruleset of main (docs/contributing.md, "Required
  # checks"), on pull requests and on main alike: it succeeds only when `changes` and every blocking job succeeded,
  # and fails when one failed, was cancelled or was skipped. The one exception is a change of only docs and media,
  # which `changes` reports as `code=false`: then a skipped job counts as passed, because its `if` skipped it for
  # files it does not read. On any other change a skipped job fails this check, so a condition that skips a job
  # wrongly shows here. The jobs are skipped by `if` inside this one workflow, not by leaving the workflow out with
  # `paths-ignore`, because a workflow that does not run reports no `required` at all, and a pull request waits
  # for a required check that never reports. Requiring this job alone keeps the protection rule unchanged when
  # jobs are added, renamed or split into matrix legs here. layout-budget is left out on purpose (non-blocking,
  # see the job).
  required:
    name: required
    if: always()
    needs:
      - changes
      - lint
      - typecheck
      - unit
      - unit-other
      - catalog-check
      - build
      - e2e
      - website
      - provenance
      - licenses
      - audit
      - workflows-and-shell
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every blocking job succeeded (or was skipped on a change of only docs and media)
        env:
          NEEDS: ${{ toJSON(needs) }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          failed=$(jq -r --arg code "$CODE" '[to_entries[]
            | select(.value.result != "success")
            | select(.key == "changes" or $code != "false" or .value.result != "skipped")
            | .key] | join(", ")' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            echo "::error title=Required checks::Not successful: ${failed}."
            exit 1
          fi
          if [ "$CODE" = false ]; then
            echo "Only docs and media changed: the blocking jobs that read them succeeded, the others were skipped."
          else
            echo "Every blocking job succeeded."
          fi
