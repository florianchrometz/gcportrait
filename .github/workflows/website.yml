# SPDX-License-Identifier: Apache-2.0
#
# Build and check the website and the static demo that sits at /demo/, once for both workflows that deploy
# them: pages.yml (a push to main and workflow dispatch) and release.yml (a tag). A pull request runs CI's
# `website` job (pr.yml), which builds and checks the site and static demo without deploying. Setup, DNS and
# deployment: docs/website.md. Rules: .github/AGENTS.md, Releases.
name: Website build

on:
  workflow_call:
    inputs:
      deploy:
        description: 'This build is deployed: strict, the repository widget authenticated, the artifact uploaded'
        type: boolean
        required: true
      app-version:
        description: "The demo's version, a tag's v1.2.3 (its v is dropped); empty for main"
        type: string
        required: false
        default: ''
      require-media:
        description: 'Fail on stale docs/media instead of warning; a tag refuses it'
        type: boolean
        required: false
        default: false
      cache:
        description: 'Reuse the pnpm store cache; a release builds from a clean store'
        type: boolean
        required: false
        default: true
    outputs:
      deploy:
        description: 'Whether this build is deployed, as its caller asked'
        value: ${{ jobs.build.outputs.deploy }}

permissions:
  contents: read

jobs:
  build:
    name: website-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      deploy: ${{ inputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: ${{ inputs.cache && 'true' || 'false' }}
      - name: Generated media up to date (warns, unless the caller refuses stale media)
        id: media
        # A tag refuses stale docs/media; a deploy of main warns in the step below instead.
        continue-on-error: ${{ !inputs.require-media }}
        run: pnpm run media --check
      - name: Warn about stale media
        if: steps.media.outcome == 'failure'
        run: |
          message="docs/media/ is stale (see the step above): run pnpm media and commit the result before the next release; the release's build of the site refuses stale media."
          echo "::warning title=Stale media::$message"
          echo "### Stale media" >>"$GITHUB_STEP_SUMMARY"
          echo "$message" >>"$GITHUB_STEP_SUMMARY"
      - name: Build the static demo (dist/demo, for /demo/)
        env:
          APP_VERSION: ${{ inputs.app-version }}
        run: |
          if [ -n "$APP_VERSION" ]; then
            pnpm run demo:static --app-version "${APP_VERSION#v}"
          else
            pnpm run demo:static
          fi
      - name: Build the website (with the demo at /demo/)
        env:
          # A deploying build answers the site's checks and the tag's, so it is the strict one (website/README.md).
          WEBSITE_STRICT: ${{ inputs.deploy && '1' || '' }}
          # The demo built in the step before, copied into the site instead of built again (website/astro.config.ts).
          WEBSITE_DEMO_DIST: dist/demo
        run: pnpm run website:build
      - name: Check the built site
        run: pnpm run website:check
      - name: Upload the Pages artifact
        if: inputs.deploy
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist
