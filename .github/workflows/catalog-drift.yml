# SPDX-License-Identifier: MIT
#
# Weekly drift check of the official Cloud Asset Inventory asset-type list (skill gcp-asset-catalog §8).
# `pnpm catalog:fetch-official` (scripts/catalog-fetch-official.mjs) downloads the official list, writes a dated
# snapshot under .agents/skills/gcp-asset-catalog/references/ and reports the identifiers added and removed since
# the newest committed snapshot, as JSON and Markdown; every run puts the Markdown in its job summary. When the
# lists differ, scripts/drift-issue.mjs opens one issue titled "Catalog drift: official asset-type list changed",
# or updates it while it is still open, with that report. It never commits: a contributor commits the new snapshot
# and the catalog changes in a pull request that closes the issue.
name: Catalog drift

on:
  schedule:
    # Mondays at 06:17 UTC; off the hour, when scheduled runs are delayed less.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-drift
  cancel-in-progress: false

jobs:
  catalog-drift:
    name: catalog-drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node
        uses: ./.github/actions/setup

      - name: Fetch the official list and compare it with the newest committed snapshot
        id: compare
        shell: bash
        run: |
          set -euo pipefail
          pnpm run catalog:fetch-official \
            --json "$RUNNER_TEMP/catalog-drift.json" \
            --markdown "$RUNNER_TEMP/catalog-drift.md"
          {
            echo '## Catalog drift'
            echo
            cat "$RUNNER_TEMP/catalog-drift.md"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "changed=$(jq -r .drift "$RUNNER_TEMP/catalog-drift.json")" >> "$GITHUB_OUTPUT"

      - name: Open or update the drift issue
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/drift-issue.mjs
          --title 'Catalog drift: official asset-type list changed'
          --marker catalog-drift
          --report "$RUNNER_TEMP/catalog-drift.json"
          --markdown "$RUNNER_TEMP/catalog-drift.md"
          --again 'The official asset-type list changed again'
          --rerun 'pnpm catalog:fetch-official'
