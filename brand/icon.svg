<!-- gcportrait's mark, drawn for the project: a frame holding a project zone above a VPC network and a subnetwork tile, in the diagram's tints, light and dark (prefers-color-scheme). No Google mark or icon. The one source of the website's favicon and logo and of the app's favicon (brand/README.md). -->
