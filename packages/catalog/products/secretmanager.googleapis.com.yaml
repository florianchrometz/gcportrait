#
# Secret Manager: secrets and their versions. Secret Manager names carry the project number
# (projects/<number>/secrets/<id>, regional secrets projects/<number>/locations/<l>/secrets/<id>), and so do
# the references workloads make to them (Cloud Run, Dataform, Cloud Build, …); a reference by project id
# matches no asset. The CAI parent of a version is its secret.
product: Secret Manager
service: secretmanager.googleapis.com
icon: secret_manager
types:
  secretmanager.googleapis.com/Secret:
    role: core
    subtitle: '{{location}} · {{data.replication.userManaged.replicas[0].location}}'
    console: 'https://console.cloud.google.com/security/secret-manager/secret/{{name | lastSegment}}/versions?project={{projectId}}'
    relations:
      - { kind: triggers, to: '$.data.topics[*].name', normalize: pubsubUri }
      - {
          kind: encryptedBy,
          to: $.data.replication.automatic.customerManagedEncryption.kmsKeyName,
          normalize: kmsKey,
        }
      - {
          kind: encryptedBy,
          to: '$.data.replication.userManaged.replicas[*].customerManagedEncryption.kmsKeyName',
          normalize: kmsKey,
        }
      - { kind: encryptedBy, to: $.data.customerManagedEncryption.kmsKeyName, normalize: kmsKey }
    notes: >-
      Global secrets replicate automatically (one CMEK key in location global) or to user-managed replicas
      (one key per replica location); the subtitle shows the asset location and the first replica, since a
      template cannot name the replication policy. Regional secrets carry their key in
      customerManagedEncryption. topics receive change notifications (Pub/Sub topics, projects/<p>/topics/<t>).
      Versions are hidden; they keep their secret as CAI parent and nest where it nests.

  secretmanager.googleapis.com/SecretVersion:
    role: hidden
    label: '{{name | parentSegment(secrets)}} v{{name | lastSegment}}'
    subtitle: '{{data.state | lower}}'
    relations:
      - {
          kind: encryptedBy,
          to: $.data.replicationStatus.automatic.customerManagedEncryption.kmsKeyVersionName,
          normalize: kmsKey,
        }
      - {
          kind: encryptedBy,
          to: '$.data.replicationStatus.userManaged.replicas[*].customerManagedEncryption.kmsKeyVersionName',
          normalize: kmsKey,
        }
      - { kind: encryptedBy, to: $.data.customerManagedEncryption.kmsKeyVersionName, normalize: kmsKey }
    notes: >-
      One per secret value; hidden and counted. The seed's predicate (state != ENABLED) has no effect on a
      hidden type, so it is left out: revealed versions show their state in the subtitle. Workloads that pin a
      version (…/secrets/<s>/versions/<n>) point here. Each CMEK replica reports the key version that
      encrypted the payload (replicationStatus for global secrets, customerManagedEncryption for regional
      ones, …/cryptoKeys/<k>/cryptoKeyVersions/<n>); the edge goes to the key, as on the secret.
