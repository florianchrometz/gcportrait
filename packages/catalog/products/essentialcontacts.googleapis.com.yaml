#
# Essential Contacts: notification contacts of an organisation, folder or project.
product: Essential Contacts
service: essentialcontacts.googleapis.com
icon: essential_contacts
types:
  essentialcontacts.googleapis.com/Contact:
    role: hidden
    label: '{{data.email}}'
    subtitle: '{{data.notificationCategorySubscriptions[0] | lower}}'
    notes: <organizations|folders|projects>/<n>/contacts/<id>; an e-mail address and notification categories.
