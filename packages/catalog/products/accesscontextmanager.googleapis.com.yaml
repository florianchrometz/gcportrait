service: accesscontextmanager.googleapis.com
icon: access_context_manager
types:
  accesscontextmanager.googleapis.com/AuthorizedOrgsDesc:
    role: hidden
    subtitle: '{{data.authorizationType | lower}} · {{data.authorizationDirection | lower}}'
