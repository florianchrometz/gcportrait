#
# The Security lens (docs/lenses-and-filters.md; skill gcp-asset-catalog §7). Types are asset types,
# <service>/* globs or *; relationKinds are the relation kinds the lens draws. packages/graph composes lenses
# with focus views and filters.
#
# encryptedBy is drawn in this lens only (skill gcp-asset-catalog §4), so every visible type with an
# encryptedBy rule is listed (the list comes from the compiled catalog: role not hidden, at least one
# encryptedBy relation, service not already covered by a glob below). The load balancer's backends, proxies
# and forwarding rules are here because Cloud Armor, SSL policies, mTLS and authorization policies attach to
# them (uses, secures); triggers shows where secrets, findings and scans publish their notifications.
title: Security
description: >-
  Keys and what they encrypt, secrets, certificate authorities, perimeters and access levels, firewall and
  security policies, tags, and the security products watching over them.
