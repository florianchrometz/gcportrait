#
# The Overview lens (docs/lenses-and-filters.md; skill gcp-asset-catalog §7). Types are asset types,
# <service>/* globs or *; relationKinds are the relation kinds the lens draws. packages/graph composes lenses
# with focus views and filters.
#
# Containers + networking + load balancing + compute + serverless + data, hidden tiers off. Lenses cannot
# exclude types, so the shared services are listed type by type: a compute.googleapis.com/* glob would pull in
# routes, firewall rules, addresses, health checks, SSL policies, images, snapshots, commitments and other
# records that do not belong on an architecture overview. Identities, keys, policies and AI services have
# their own lenses.
title: Overview
description: >-
  The architecture at a glance: the resource hierarchy, networks, load balancing, compute, serverless and
  data stores. Hidden operational records, identities and keys stay out.
