#
# The Networking lens (docs/lenses-and-filters.md; skill gcp-asset-catalog §7). Types are asset types,
# <service>/* globs or *; relationKinds are the relation kinds the lens draws. packages/graph composes lenses
# with focus views and filters.
#
# Network Security types are listed one by one (Cloud NGFW, Network Security Integration, DNS Armor),
# because networksecurity.googleapis.com/* would also pull in the service mesh and Secure Web Proxy policy
# types of the load-balancing lens. `secures` is drawn so that firewall policies show the organisation,
# folders and networks they govern. Private connectivity of other products (Datastream and Database
# Migration private connections, Integration Connectors endpoint attachments, Cloud Build private pools,
# Workstations clusters, Managed Microsoft AD, Cloud IDS) is here because it is how those products join a VPC.
title: Networking
description: >-
  VPC networks, subnets, routing, firewalls, private connectivity, hybrid links and DNS: how the networks
  are built and joined.
types:
